<!DOCTYPE html>
<link rel="icon" href="handzzz.png">

    <meta charset='UTF-8'/>
    <title>Tattoo</title>
    <link rel='stylesheet' href='photo.css'/>
    <link rel="stylesheet" href="logo.css"/>
    <style>
      .tattoo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .tattoo-grid img {
        width: 100%;
        height: auto;
        display: block;
        border: 2px solid black;
      }
      .tattoo-grid .photo-wrap {
        padding: 12px;
        box-sizing: border-box;
      }
      @media (max-width: 768px) {
        .tattoo-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }
      }
    </style>
    <script data-goatcounter="https://mastershizy.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
  <body>
    <a href="index.html" class="home-logo" title="Home"><img src="handzzz.png" alt="Home"></a>
